<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citi fee accruals demo</title>
<style>
__CSS__
</style>
<style>
  /* Demo page layout only; all design comes from nyl.css above. */
  body { margin: 0; }
  .demo-main { max-width: 1360px; margin: 0 auto; }
  .demo-page-head { padding: 1.75rem 1.5rem 0.5rem; }
  .demo-row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: end; }
  .demo-spacer { height: 1rem; }
  .demo-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .demo-field { display: flex; flex-direction: column; min-width: 180px; }
  .demo-email { width: 100%; min-height: 260px; font-family: var(--font-body); font-size: 0.9rem; box-sizing: border-box; }
  .demo-red-line { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .demo-red-line select { width: 100%; max-width: 640px; margin-top: 0.4rem; }
  .demo-confirm { margin-top: 1rem; }
  .nyl-table td.notes { min-width: 260px; }
  @media (max-width: 600px) { .demo-field { min-width: 100%; } }
</style>
</head>
<body class="nyl">
<header class="nyl-header">
  <img class="nyl-header__logo" src="__LOGO__" alt="New York Life">
  <span class="nyl-header__name">Citi fee accruals</span>
  <nav class="nyl-tabs" role="tablist" aria-label="Pages" id="tabs"></nav>
</header>

<main class="demo-main" id="app" role="tabpanel" tabindex="-1"></main>

<footer class="nyl-footer">
  <img class="nyl-footer__logo" src="__LOGO__" alt="New York Life">
  <span>New York Life Insurance Company. For internal use only.</span>
  <span class="nyl-muted">Demo with real figures. Nothing is saved.</span>
</footer>

<div class="nyl-toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="application/json" id="demo-data">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("demo-data").textContent);
  var app = document.getElementById("app");

  // ------------------------------------------------------------------ theme (?theme=dark or ?theme=light)
  var theme = new URLSearchParams(location.search).get("theme");
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);

  // ------------------------------------------------------------------ formatting
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September",
                     "October", "November", "December"];
  var nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(v) {
    if (v == null || v === "") return "";
    var n = Math.round(Number(v));
    return (n < 0 ? "-$" : "$") + nf.format(Math.abs(n));
  }
  function parts(iso) { var p = String(iso).split("-"); return [Number(p[0]), Number(p[1]), Number(p[2])]; }
  function fdate(iso) { if (!iso) return ""; var p = parts(iso); return p[2] + " " + MONTHS[p[1] - 1] + " " + p[0]; }
  function fdateLong(iso) { var p = parts(iso); return p[2] + " " + MONTHS_LONG[p[1] - 1] + " " + p[0]; }
  function fdateCiti(iso) { var p = parts(iso); return (p[2] < 10 ? "0" : "") + p[2] + "-" + MONTHS[p[1] - 1] + "-" + p[0]; }
  var AS_OF = fdateLong(D.as_of);

  // ------------------------------------------------------------------ building blocks
  function chip(text, kind) { return '<span class="nyl-chip nyl-chip--' + kind + '">' + esc(text) + "</span>"; }
  var RESULT = { green: ["Match", "match"], yellow: ["Review", "review"], red: ["No match", "nomatch"],
                 manual: ["Manual match", "manual"], prior: ["Before tracking", "plain"] };
  function resultChip(s) { var r = RESULT[s] || [s, "plain"]; return chip(r[0], r[1]); }
  var STATUS = { "Paid": "pass", "Approved - awaiting payment": "approved", "Invoiced - awaiting approval": "info",
                 "Due - not invoiced": "review", "Not yet due": "plain", "Written off": "plain" };
  function statusText(s) { return String(s).replace(" - ", ", "); }
  function statusChip(s) { return chip(statusText(s), STATUS[s] || "plain"); }
  var CHECK_KIND = { green: "pass", yellow: "review", red: "fail" };

  function pageHead(eyebrow, title, lede) {
    return '<div class="demo-page-head"><p class="nyl-eyebrow">' + esc(eyebrow) + '</p><h1>' + esc(title) +
      "</h1>" + (lede ? '<p class="nyl-lede">' + esc(lede) + "</p>" : "") + "</div>";
  }
  // cols: [{key, label, num, render, cls}]
  function table(cols, rows, opts) {
    opts = opts || {};
    var h = '<div class="nyl-table-wrap"><table class="nyl-table"><thead><tr>';
    cols.forEach(function (c) { h += '<th class="' + (c.num ? "num" : "") + '">' + esc(c.label) + "</th>"; });
    h += "</tr></thead><tbody>";
    rows.forEach(function (r, i) {
      var attrs = opts.rowAttrs ? opts.rowAttrs(r, i) : "";
      h += "<tr " + attrs + ">";
      cols.forEach(function (c) {
        var v = c.render ? c.render(r) : esc(r[c.key]);
        h += '<td class="' + (c.num ? "num " : "") + (c.cls || "") + '">' + v + "</td>";
      });
      h += "</tr>";
      if (opts.after) h += opts.after(r, i);
    });
    if (opts.total) {
      h += '<tr class="is-total">';
      cols.forEach(function (c, i) { h += '<td class="' + (c.num ? "num" : "") + '">' + (opts.total[c.key] != null ? opts.total[c.key] : (i === 0 ? "Total" : "")) + "</td>"; });
      h += "</tr>";
    }
    return h + "</tbody></table></div>";
  }
  function kpi(label, value, note) {
    return '<div class="nyl-card"><p class="nyl-kpi__label">' + esc(label) + '</p><div class="nyl-kpi__value">' +
      esc(value) + "</div>" + (note ? '<div class="nyl-kpi__note">' + esc(note) + "</div>" : "") + "</div>";
  }
  function sum(rows, k) { return rows.reduce(function (a, r) { return a + (Number(r[k]) || 0); }, 0); }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 6000);
  }
  function barChart(rows) {
    var W = 560, H = 270, L = 16, R = 16, T = 28, B = 34;
    var max = Math.max.apply(null, rows.map(function (r) { return r.amount; }).concat([1]));
    var slot = (W - L - R) / Math.max(rows.length, 1), bw = Math.min(64, slot * 0.6);
    var s = '<svg class="nyl-chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Outstanding by fee year">';
    rows.forEach(function (r, i) {
      var h = (H - T - B) * r.amount / max, x = L + slot * i + (slot - bw) / 2, y = H - B - h;
      s += '<rect class="bar" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + h.toFixed(1) + '"><title>' + r.year + ": " + money(r.amount) + "</title></rect>";
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 7).toFixed(1) + '" text-anchor="middle">' + money(r.amount) + "</text>";
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - B + 20) + '" text-anchor="middle">' + r.year + "</text>";
    });
    s += '<line class="axis" x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '"></line>';
    return s + "</svg>";
  }

  // ------------------------------------------------------------------ pages
  var PAGES = [
    ["overview", "Overview"], ["upload", "Upload Citi invoice"], ["invoices", "Invoices & payments"],
    ["agreements", "Funding agreements"], ["followup", "Citi follow-up"], ["monthend", "Month-end"],
    ["exceptions", "Exceptions"], ["audit", "Audit history"]
  ];
  var render = {};

  render.overview = function () {
    var k = D.kpis, b = D.bridge_summary;
    var diff = b.tool_total - b.tracker_total;
    var checks = D.checks.map(function (c) {
      return "<li><span>" + esc(c.label) + '<br><span class="nyl-muted">' + esc(c.value) + "</span></span>" +
        chip(c.chip_text, c.chip) + "</li>";
    }).join("");
    var nq = D.next_quarter;
    return '<section class="nyl-hero"><div class="nyl-hero__field"></div><div class="nyl-hero__inner">' +
      '<div class="nyl-hero__main"><p class="nyl-eyebrow">Accrual at ' + esc(AS_OF) + "</p>" +
      '<h1 class="nyl-title">What we owe Citi, and why</h1>' +
      '<div class="nyl-figure">' + money(k.outstanding) + "</div>" +
      "<p>That is " + money(Math.abs(diff)) + (diff < 0 ? " less" : " more") + " than the old tracker's " +
      money(b.tracker_total) + ", and every dollar of the difference is explained on the month-end bridge.</p></div>" +
      '<div class="nyl-hero__side"><h3>Reconciliation checks</h3><ul class="nyl-checks">' + checks + "</ul></div>" +
      "</div></section>" +
      '<section class="nyl-section"><ol class="nyl-steps">' +
      '<li class="nyl-step"><span class="nyl-step__title">Upload</span><span class="nyl-step__text">Drop in the Citi invoice PDF</span></li>' +
      '<li class="nyl-step"><span class="nyl-step__title">Match</span><span class="nyl-step__text">Each line matched one to one to a fee</span></li>' +
      '<li class="nyl-step"><span class="nyl-step__title">Approve and pay</span><span class="nyl-step__text">Approval and payment dates recorded</span></li>' +
      '<li class="nyl-step"><span class="nyl-step__title">Report</span><span class="nyl-step__text">Month-end accrual and Excel package</span></li>' +
      "</ol></section>" +
      '<section class="nyl-band"><div class="nyl-grid nyl-grid--4">' +
      kpi("Outstanding accrual", money(k.outstanding), "at " + AS_OF) +
      kpi("Fees in the accrual", String(k.fee_count), "due and not yet paid or written off") +
      kpi("Due, not yet invoiced by Citi", money(k.due_not_invoiced), k.due_not_invoiced_count + " fees") +
      kpi("Invoiced, awaiting payment", money(k.invoiced_awaiting_payment), k.invoiced_awaiting_payment_count + " fees") +
      "</div></section>" +
      '<section class="nyl-section"><div class="nyl-grid nyl-grid--2">' +
      '<div class="nyl-card"><h3>Outstanding by fee year</h3>' + barChart(D.by_fee_year) + "</div>" +
      '<div class="nyl-card"><h3>Fees due October to December 2026</h3>' +
      table([{ key: "due", label: "Due", render: function (r) { return fdate(r.due); } },
             { key: "series", label: "Series" }, { key: "fa_number", label: "FA", num: true },
             { key: "amount", label: "Fee", num: true, render: function (r) { return money(r.amount); } }],
            nq, { total: { due: nq.length + " fees", amount: money(sum(nq, "amount")) } }) +
      "</div></div></section>";
  };

  // ---- upload ----
  var upload = { sample: null, choices: {} };
  render.upload = function () {
    var h = pageHead("Accrual", "Upload Citi invoice",
      "Drop in the PDF. Every fee line is matched one to one to a funding agreement and its anniversary.") +
      '<section class="nyl-section" style="padding-top:0.5rem"><div class="nyl-dropzone">' +
      "<p><strong>Drop a Citi invoice PDF here</strong></p>" +
      '<p class="nyl-muted">This demo can\'t read your files. Try one of the two samples.</p>' +
      '<div class="demo-row" style="justify-content:center">' +
      '<button class="nyl-btn" data-sample="real">Citi invoice 178352</button>' +
      '<button class="nyl-btn nyl-btn--secondary" data-sample="problem">Edited copy of 178352 with planted problems</button>' +
      "</div></div>" + '<ol class="nyl-progress" id="progress"></ol><div id="upload-result"></div></section>';
    return h;
  };
  function wireUpload() {
    app.querySelectorAll("[data-sample]").forEach(function (b) {
      b.addEventListener("click", function () { runSample(b.getAttribute("data-sample")); });
    });
    if (upload.sample) showResult(upload.sample, false);
  }
  function runSample(key) {
    var s = D.samples[key], prog = document.getElementById("progress"), res = document.getElementById("upload-result");
    upload.sample = key; upload.choices = {};
    res.innerHTML = ""; prog.innerHTML = "";
    var steps = ["Reading " + s.file_name, "Found invoice " + s.invoice_no + " with " + s.lines.length + " fee lines",
                 "Checking the program, duplicates and the invoice total",
                 "Matching each line to a funding agreement and anniversary", "Done"];
    steps.forEach(function (t, i) {
      setTimeout(function () {
        var li = document.createElement("li"); li.className = "is-done"; li.textContent = t; prog.appendChild(li);
        if (i === steps.length - 1) showResult(key, true);
      }, 280 * (i + 1));
    });
  }
  function showResult(key, scroll) {
    var s = D.samples[key], res = document.getElementById("upload-result"), c = s.counts;
    var checks = s.checks.map(function (x) {
      return "<li><span><strong>" + esc(x.name) + '</strong><br><span class="nyl-muted">' + esc(x.detail) +
        "</span></span>" + chip(x.status === "green" ? "Pass" : x.status === "yellow" ? "Review" : "Fail", CHECK_KIND[x.status] || "info") + "</li>";
    }).join("");
    var lineCols = [
      { key: "line_no", label: "Line", num: true }, { key: "status", label: "Result", render: function (r) { return resultChip(r.status); } },
      { key: "series", label: "Citi series" }, { key: "maturity_date", label: "Citi maturity", render: function (r) { return fdate(r.maturity_date); } },
      { key: "fee_date", label: "Citi fee date", render: function (r) { return fdate(r.fee_date); } },
      { key: "amount", label: "Billed", num: true, render: function (r) { return money(r.amount); } },
      { key: "fa_number", label: "Matched FA", num: true }, { key: "our_series", label: "Our series" },
      { key: "anniversary", label: "Anniversary", render: function (r) { return fdate(r.anniversary); } },
      { key: "expected", label: "Expected", num: true, render: function (r) { return money(r.expected); } },
      { key: "notes", label: "Notes", cls: "notes wrap", render: function (r) { return esc(r.notes.join(" ")); } }
    ];
    var reds = s.lines.filter(function (l) { return l.status === "red"; });
    var h = '<div class="demo-spacer"></div><div class="nyl-card"><h2>Invoice ' + esc(s.invoice_no) + "</h2>" +
      "<p>" + esc(s.note) + ". " + esc(s.program) + ", dated " + fdateLong(s.invoice_date) + ", fees due " +
      fdate(s.arrears_start) + " to " + fdate(s.arrears_end) + ". Total " + money(s.total) + ".</p>" +
      '<ul class="nyl-checks">' + checks + "</ul>" +
      '<div class="demo-spacer"></div><div class="demo-chips">' + chip(c.green + " match", "match") +
      chip(c.yellow + " review", "review") + chip(c.red + " no match", "nomatch") +
      (c.prior ? chip(c.prior + " before tracking", "plain") : "") + "</div></div>" +
      '<div class="demo-spacer"></div>' + table(lineCols, s.lines);
    if (s.not_billed.length) {
      h += '<div class="demo-spacer"></div><div class="nyl-notice">' + chip("Info", "info") + " <strong>" +
        s.not_billed.length + " fees due in this period that Citi didn't bill (" + money(sum(s.not_billed, "amount")) +
        ").</strong> They stay in the accrual and go on the Citi follow-up list.<ul>" +
        s.not_billed.map(function (n) { return "<li>" + esc(n.series) + ", FA " + n.fa_number + ", due " + fdate(n.due) + ", " + money(n.amount) + "</li>"; }).join("") +
        "</ul></div>";
    }
    if (reds.length) {
      h += '<div class="demo-spacer"></div><div class="nyl-card"><h3>Decide the lines with no match</h3>' +
        "<p>Pick the fee each line pays, or leave it unmatched. Unmatched lines stay on the invoice, don't reduce the accrual, and go to Exceptions.</p>" +
        reds.map(function (l) {
          var opts = '<option value="">Leave unmatched</option>' + l.options.map(function (o) {
            return '<option value="' + esc(o.event_id) + '">Match to ' + esc(o.label) + "</option>";
          }).join("");
          return '<div class="demo-red-line"><label class="nyl-label" for="red-' + l.line_no + '"><strong>Line ' + l.line_no +
            "</strong>: series " + esc(l.series) + ", " + fdate(l.fee_date) + ", " + money(l.amount) + ". " + esc(l.notes.join(" ")) +
            '</label><select class="nyl-select" id="red-' + l.line_no + '" data-line="' + l.line_no + '">' + opts + "</select></div>";
        }).join("") + "</div>";
    }
    h += '<div class="demo-spacer"></div><div class="nyl-card"><h3>Approval and payment</h3><div class="demo-row">' +
      '<div class="demo-field"><label class="nyl-label" for="appr">Approved for payment</label><input class="nyl-input" type="date" id="appr" value="' + esc(s.approval_date || "") + '"></div>' +
      '<div class="demo-field"><label class="nyl-label" for="paid">Payment date</label><input class="nyl-input" type="date" id="paid"></div>' +
      '<div class="demo-field"><label class="nyl-label" for="ref">Payment reference</label><input class="nyl-input" type="text" id="ref" placeholder="Optional"></div>' +
      '<button class="nyl-btn" id="post">Post invoice ' + esc(s.invoice_no) + "</button></div>" +
      '<p class="nyl-muted">' + (s.approval_date ? "Approval date read from the \"okay to pay\" stamp on the PDF." : "No approval stamp on this PDF, so the approval date starts blank.") +
      " Leave the payment date blank until the payment goes out.</p>" +
      '<div id="confirm" class="demo-confirm"></div></div>';
    res.innerHTML = h;
    res.querySelectorAll("select[data-line]").forEach(function (sel) {
      sel.addEventListener("change", function () { upload.choices[sel.getAttribute("data-line")] = sel.value; });
    });
    document.getElementById("post").addEventListener("click", function () { post(s); });
    if (scroll) res.scrollIntoView({ block: "start" });
  }
  function post(s) {
    var appr = document.getElementById("appr").value, paid = document.getElementById("paid").value;
    var box = document.getElementById("confirm");
    if (paid && !appr) {
      box.innerHTML = '<div class="nyl-notice">' + chip("Fail", "fail") + " Add the approval date before recording a payment.</div>";
      return;
    }
    var manual = 0, unmatched = 0;
    s.lines.forEach(function (l) { if (l.status === "red") { if (upload.choices[l.line_no]) manual++; else unmatched++; } });
    var state = paid ? "Paid" : appr ? "Approved - awaiting payment" : "Invoiced - awaiting approval";
    box.innerHTML = '<div class="nyl-notice">' + chip("Demo only", "info") + " <strong>Nothing was saved.</strong> In the app, invoice " +
      esc(s.invoice_no) + " would now be posted: " + s.counts.green + " matched, " + s.counts.yellow + " for review, " +
      manual + " matched manually, " + unmatched + " unmatched" + (unmatched ? " (sent to Exceptions)" : "") + ". " +
      (appr ? "Approval date " + fdate(appr) + " recorded. " : "No approval date yet. ") +
      (paid ? "Payment date " + fdate(paid) + " recorded. " : "No payment date yet. ") +
      "The matched fees would show as " + statusChip(state) + " and " +
      (paid ? "leave the accrual." : "stay in the accrual until they are paid.") + "</div>";
  }

  // ---- invoices ----
  render.invoices = function () {
    var open = {};
    var cols = [
      { key: "invoice_no", label: "Invoice" }, { key: "program", label: "Program" },
      { key: "invoice_date", label: "Invoice date", render: function (r) { return fdate(r.invoice_date); } },
      { key: "arrears", label: "Fees due", render: function (r) { return r.arrears_start ? fdate(r.arrears_start) + " to " + fdate(r.arrears_end) : ""; } },
      { key: "line_count", label: "Lines", num: true },
      { key: "total", label: "Total", num: true, render: function (r) { return money(r.total); } },
      { key: "counts", label: "Result", render: function (r) {
          return ["green", "yellow", "red", "manual", "prior"].filter(function (k) { return r.counts[k]; })
            .map(function (k) { return chip(r.counts[k] + " " + RESULT[k][0].toLowerCase(), RESULT[k][1]); }).join(" ");
        } },
      { key: "approval_date", label: "Approved", render: function (r) { return fdate(r.approval_date); } },
      { key: "payment_date", label: "Paid", render: function (r) { return fdate(r.payment_date); } },
      { key: "source", label: "Source", render: function (r) { return r.source === "pdf" ? "PDF" : "Rebuilt from tracker"; } }
    ];
    return pageHead("Accrual", "Invoices and payments", "Every Citi invoice loaded so far. Select a row to see its lines.") +
      '<section class="nyl-section" style="padding-top:0.5rem">' +
      table(cols, D.invoices, {
        rowAttrs: function (r, i) { return 'class="is-clickable" tabindex="0" aria-expanded="false" data-inv="' + i + '"'; },
        after: function (r, i) { return '<tr class="is-detail" id="inv-detail-' + i + '" hidden><td colspan="' + cols.length + '"></td></tr>'; }
      }) + "</section>";
  };
  function wireInvoices() {
    var lineCols = [
      { key: "line_no", label: "Line", num: true }, { key: "status", label: "Result", render: function (r) { return resultChip(r.status); } },
      { key: "series", label: "Series" }, { key: "maturity_date", label: "Maturity", render: function (r) { return fdate(r.maturity_date); } },
      { key: "fee_date", label: "Fee date", render: function (r) { return fdate(r.fee_date); } },
      { key: "amount", label: "Amount", num: true, render: function (r) { return money(r.amount); } },
      { key: "fa_number", label: "FA", num: true }, { key: "notes", label: "Notes", cls: "notes wrap" }
    ];
    toggleRows("[data-inv]", "data-inv", "inv-detail-", function (i) { return table(lineCols, D.invoices[i].lines); });
  }
  function toggleRows(sel, attr, prefix, content) {
    app.querySelectorAll(sel).forEach(function (tr) {
      function go() {
        var i = tr.getAttribute(attr), det = document.getElementById(prefix + i), opening = det.hidden;
        if (opening && !det.firstChild.innerHTML) det.firstChild.innerHTML = content(i);
        det.hidden = !opening; tr.setAttribute("aria-expanded", String(opening));
      }
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }

  // ---- agreements ----
  var agr = { q: "", program: "", outstanding: false };
  render.agreements = function () {
    var progs = Array.from(new Set(D.agreements.map(function (a) { return a.program; }))).sort();
    return pageHead("Records", "Funding agreements",
      "Active agreements (maturing after " + AS_OF + ") and the fee schedule each one generates. Select a row to see its schedule.") +
      '<section class="nyl-section" style="padding-top:0.5rem"><div class="demo-row">' +
      '<div class="demo-field"><label class="nyl-label" for="agr-q">Search</label><input class="nyl-input" id="agr-q" type="search" placeholder="Series, FA or ISIN" value="' + esc(agr.q) + '"></div>' +
      '<div class="demo-field"><label class="nyl-label" for="agr-p">Program</label><select class="nyl-select" id="agr-p"><option value="">All programs</option>' +
      progs.map(function (p) { return '<option' + (agr.program === p ? " selected" : "") + ">" + esc(p) + "</option>"; }).join("") + "</select></div>" +
      '<label class="nyl-toggle"><input type="checkbox" id="agr-o"' + (agr.outstanding ? " checked" : "") + "> Only with an amount outstanding</label>" +
      '</div><p class="nyl-muted" id="agr-count"></p><div id="agr-table"></div></section>';
  };
  function wireAgreements() {
    var cols = [
      { key: "fa_number", label: "FA", num: true }, { key: "series", label: "Series" }, { key: "program", label: "Program" },
      { key: "isin", label: "ISIN", cls: "wrap" },
      { key: "issue_date", label: "Issue date", render: function (r) { return fdate(r.issue_date); } },
      { key: "maturity_date", label: "Maturity date", render: function (r) { return fdate(r.maturity_date); } },
      { key: "outstanding", label: "Outstanding", num: true, render: function (r) { return r.outstanding ? money(r.outstanding) : ""; } }
    ];
    var schedCols = [
      { key: "period", label: "Fee year", num: true }, { key: "due", label: "Due", render: function (r) { return fdate(r.due); } },
      { key: "amount", label: "Fee", num: true, render: function (r) { return money(r.amount); } },
      { key: "status", label: "Status", render: function (r) { return statusChip(r.status); } },
      { key: "invoice_no", label: "Citi invoice" }
    ];
    function draw() {
      var q = agr.q.trim().toLowerCase();
      var rows = D.agreements.filter(function (a) {
        return (!agr.program || a.program === agr.program) && (!agr.outstanding || a.outstanding > 0) &&
          (!q || [a.series, String(a.fa_number), a.isin || ""].some(function (v) { return v.toLowerCase().indexOf(q) >= 0; }));
      });
      document.getElementById("agr-count").textContent = "Showing " + rows.length + " of " + D.agreements.length + " agreements.";
      document.getElementById("agr-table").innerHTML = table(cols, rows, {
        rowAttrs: function (r) { return 'class="is-clickable" tabindex="0" aria-expanded="false" data-fa="' + r.fa_number + '"'; },
        after: function (r) { return '<tr class="is-detail" id="fa-detail-' + r.fa_number + '" hidden><td colspan="' + cols.length + '"></td></tr>'; }
      });
      toggleRows("[data-fa]", "data-fa", "fa-detail-", function (fa) {
        var a = D.agreements.filter(function (x) { return String(x.fa_number) === String(fa); })[0];
        return a.schedule.length ? table(schedCols, a.schedule) : '<p class="nyl-muted">No fees fall due in the tracked period.</p>';
      });
    }
    document.getElementById("agr-q").addEventListener("input", function (e) { agr.q = e.target.value; draw(); });
    document.getElementById("agr-p").addEventListener("change", function (e) { agr.program = e.target.value; draw(); });
    document.getElementById("agr-o").addEventListener("change", function (e) { agr.outstanding = e.target.checked; draw(); });
    draw();
  }

  // ---- follow-up ----
  var fu = { past: true, never: false };
  render.followup = function () {
    return pageHead("Records", "Citi follow-up",
      "Fees that are due but Citi hasn't invoiced. Sending this list each quarter catches missing invoices before they become write-offs.") +
      '<section class="nyl-section" style="padding-top:0.5rem"><div id="fu-kpis" class="nyl-grid nyl-grid--3"></div>' +
      '<div class="demo-spacer"></div><div class="demo-row">' +
      '<label class="nyl-toggle"><input type="checkbox" id="fu-past"' + (fu.past ? " checked" : "") + "> Only past the invoice window</label>" +
      '<label class="nyl-toggle"><input type="checkbox" id="fu-never"' + (fu.never ? " checked" : "") + "> Only FAs Citi has never billed</label>" +
      '</div><div class="demo-spacer"></div><div id="fu-table"></div><div class="demo-spacer"></div>' +
      '<div class="nyl-grid nyl-grid--2"><div class="nyl-card"><h3>Download</h3><p>The follow-up list as an Excel file, ready to attach.</p>' +
      '<button class="nyl-btn" id="fu-dl">Download follow-up list</button></div>' +
      '<div class="nyl-card"><h3>Email to Citi billing</h3><label class="nyl-label" for="fu-email">Copy into Outlook</label>' +
      '<textarea class="nyl-input demo-email" id="fu-email" readonly></textarea><div class="demo-spacer"></div>' +
      '<button class="nyl-btn nyl-btn--secondary" id="fu-copy">Copy email</button></div></div></section>';
  };
  function followupRows() {
    return D.followup.filter(function (r) { return (!fu.past || r.past_window) && (!fu.never || r.never_billed); });
  }
  function emailText(rows) {
    var out = ["To: " + D.citi_email, "Subject: New York Life Global Funding - trustee fees not yet invoiced", "",
      "Hello Citi GATS Billing team,", "",
      "Our records show the following annual trustee fees are due but have not appeared on an invoice. " +
      "Could you please confirm whether they will be billed, or let us know if your records differ?", ""];
    rows.forEach(function (r) {
      out.push("  - Series " + r.series + " (maturing " + fdateCiti(r.maturity_date) + "), fee due " + fdateCiti(r.due) + ": " + money(r.amount));
    });
    return out.concat(["", "Total: " + money(sum(rows, "amount")), "", "Thank you,", "[Your name]"]).join("\n");
  }
  function wireFollowup() {
    var cols = [
      { key: "program", label: "Program" }, { key: "series", label: "Series" }, { key: "fa_number", label: "FA", num: true },
      { key: "isin", label: "ISIN", cls: "wrap" }, { key: "due", label: "Fee due", render: function (r) { return fdate(r.due); } },
      { key: "amount", label: "Expected fee", num: true, render: function (r) { return money(r.amount); } },
      { key: "days", label: "Days since due", num: true },
      { key: "why", label: "Why", render: function (r) {
          return r.never_billed ? chip("Never billed", "fail") : r.past_window ? chip("Missed on its invoice", "review") : chip("Invoice not yet due", "plain");
        } }
    ];
    function draw() {
      var rows = followupRows(), never = rows.filter(function (r) { return r.never_billed; });
      var neverFas = new Set(never.map(function (r) { return r.fa_number; }));
      var oldest = rows.reduce(function (a, r) { return Math.max(a, r.days || 0); }, 0);
      document.getElementById("fu-kpis").innerHTML =
        kpi("Fees to chase", String(rows.length), money(sum(rows, "amount"))) +
        kpi("FAs Citi has never billed", String(neverFas.size), money(sum(never, "amount"))) +
        kpi("Oldest unbilled fee", rows.length ? oldest + " days" : "None", "since its due date");
      document.getElementById("fu-table").innerHTML = table(cols, rows, { total: { program: rows.length + " fees", amount: money(sum(rows, "amount")) } });
      document.getElementById("fu-email").value = emailText(rows);
    }
    document.getElementById("fu-past").addEventListener("change", function (e) { fu.past = e.target.checked; draw(); });
    document.getElementById("fu-never").addEventListener("change", function (e) { fu.never = e.target.checked; draw(); });
    document.getElementById("fu-dl").addEventListener("click", function () {
      toast("In the app this downloads the follow-up list as an Excel file. Nothing is downloaded in the demo.");
    });
    document.getElementById("fu-copy").addEventListener("click", function () {
      var ta = document.getElementById("fu-email"), text = ta.value;
      function done() { toast("Email copied. Paste it into Outlook and sign it with your name."); }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, function () { ta.select(); document.execCommand("copy"); done(); });
      } else { ta.select(); document.execCommand("copy"); done(); }
    });
    draw();
  }

  // ---- month-end ----
  render.monthend = function () {
    var r = D.rollforward, b = D.bridge_summary, unexplained = Math.round(b.difference - b.explained);
    var roll = [
      { label: "Opening accrual at " + fdate(D.prev_month_end), amount: r.opening },
      { label: "New fees due", amount: r.new_fees }, { label: "Paid", amount: -r.paid },
      { label: "Written off", amount: -r.written_off }
    ];
    var amtCol = { key: "amount", label: "Amount", num: true, render: function (x) { return money(x.amount); } };
    var years = D.by_fee_year;
    var bridgeCols = [
      { key: "fa_number", label: "FA", num: true }, { key: "series", label: "Series" }, { key: "fee_year", label: "Fee year", num: true },
      { key: "tracker_owed", label: "Tracker", num: true, render: function (x) { return money(x.tracker_owed); } },
      { key: "tool_owed", label: "Tool", num: true, render: function (x) { return money(x.tool_owed); } },
      { key: "difference", label: "Difference", num: true, render: function (x) { return money(x.difference); } },
      { key: "category", label: "Category" }, { key: "explanation", label: "Explanation", cls: "wrap" }
    ];
    return pageHead("Accrual", "Month-end report",
      "The accrual at " + AS_OF + " with its rollforward and the bridge from the old tracker.") +
      '<section class="nyl-section" style="padding-top:0.5rem"><div class="nyl-grid nyl-grid--2">' +
      '<div class="nyl-card"><h3>September 2026 rollforward</h3>' +
      table([{ key: "label", label: "" }, amtCol], roll, { total: { label: "Closing accrual at " + fdate(D.as_of), amount: money(r.closing) } }) +
      '<p>Check against the outstanding detail: ' + money(r.check) + " " + chip(r.check === 0 ? "Pass" : "Fail", r.check === 0 ? "pass" : "fail") + "</p></div>" +
      '<div class="nyl-card"><h3>By fee year</h3>' +
      table([{ key: "year", label: "Fee year" }, { key: "count", label: "Fees", num: true }, amtCol], years,
            { total: { count: String(sum(years, "count")), amount: money(sum(years, "amount")) } }) + "</div>" +
      '<div class="nyl-card"><h3>Bridge from the tracker</h3>' +
      table([{ key: "category", label: "Category" }, { key: "count", label: "Items", num: true }, amtCol], D.bridge_groups,
            { total: { count: String(sum(D.bridge_groups, "count")), amount: money(sum(D.bridge_groups, "amount")) } }) + "</div>" +
      '<div class="nyl-card"><h3>Tracker to tool</h3><ul class="nyl-checks">' +
      "<li><span>Old tracker total</span><span>" + money(b.tracker_total) + "</span></li>" +
      "<li><span>Tool total</span><span>" + money(b.tool_total) + "</span></li>" +
      "<li><span>Difference</span><span>" + money(b.difference) + "</span></li>" +
      "<li><span>Explained by the bridge</span><span>" + money(b.explained) + "</span></li>" +
      "<li><span>Unexplained</span><span>" + money(unexplained) + " " + chip(unexplained === 0 ? "Pass" : "Fail", unexplained === 0 ? "pass" : "fail") + "</span></li>" +
      "</ul></div></div>" +
      '<div class="demo-spacer"></div><div class="demo-row"><button class="nyl-btn" id="me-dl">Download Excel report</button>' +
      '<button class="nyl-btn nyl-btn--secondary" id="me-fin">Finalize ' + esc(AS_OF) + "</button></div>" +
      '<div class="demo-spacer"></div><h2>Bridge detail</h2>' + table(bridgeCols, D.bridge) + "</section>";
  };
  function wireMonthend() {
    document.getElementById("me-dl").addEventListener("click", function () {
      toast("In the app this downloads the month-end Excel package: summary totals as live formulas, outstanding detail, all fees due, Citi follow-up, invoices and open exceptions.");
    });
    document.getElementById("me-fin").addEventListener("click", function () {
      toast("In the app this freezes the " + AS_OF + " accrual of " + money(D.rollforward.closing) + " with its Excel package, so the reported number can always be reproduced. Nothing is saved in the demo.");
    });
  }

  // ---- exceptions ----
  render.exceptions = function () {
    var cats = {};
    D.issues.forEach(function (i) { cats[i.category] = (cats[i.category] || 0) + 1; });
    return pageHead("Records", "Exceptions",
      "Data issues found while loading the documents, other than the opening-balance bridge (see Month-end).") +
      '<section class="nyl-section" style="padding-top:0.5rem"><div class="demo-chips">' +
      Object.keys(cats).sort().map(function (k) { return chip(cats[k] + " " + k.toLowerCase(), "plain"); }).join("") +
      '</div><div class="demo-spacer"></div>' +
      table([{ key: "category", label: "Category" }, { key: "reference", label: "Reference" },
             { key: "description", label: "Description", cls: "wrap" },
             { key: "amount", label: "Amount", num: true, render: function (r) { return money(r.amount); } },
             { key: "status", label: "Status", render: function (r) { return chip(r.status, r.status === "Open" ? "review" : "pass"); } }],
            D.issues) + "</section>";
  };

  // ---- audit ----
  render.audit = function () {
    return pageHead("Records", "Audit history",
      "Every change in the app is written to the audit log with the signed-in user's email, the old and new values, and a reason.") +
      '<section class="nyl-section" style="padding-top:0.5rem"><div class="nyl-notice">' + chip("Illustrative", "info") +
      " These entries show what the log looks like. They aren't real history.</div><div class=\"demo-spacer\"></div>" +
      table([{ key: "ts", label: "When" }, { key: "user", label: "User" }, { key: "action", label: "Action" },
             { key: "entity", label: "Record" }, { key: "detail", label: "Change", cls: "wrap" }], D.audit) + "</section>";
  };

  var WIRE = { upload: wireUpload, invoices: wireInvoices, agreements: wireAgreements, followup: wireFollowup, monthend: wireMonthend };

  // ------------------------------------------------------------------ navigation
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = PAGES.map(function (p) {
    return '<button class="nyl-tab" role="tab" id="tab-' + p[0] + '" data-page="' + p[0] + '" aria-selected="false">' + esc(p[1]) + "</button>";
  }).join("");
  tabs.addEventListener("click", function (e) {
    var b = e.target.closest("[data-page]");
    if (b) location.hash = b.getAttribute("data-page");
  });
  function show() {
    var page = location.hash.replace("#", "");
    if (!render[page]) page = "overview";
    tabs.querySelectorAll("[data-page]").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.getAttribute("data-page") === page));
    });
    app.setAttribute("aria-labelledby", "tab-" + page);
    document.getElementById("toast").hidden = true;
    app.innerHTML = render[page]();
    if (WIRE[page]) WIRE[page]();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
